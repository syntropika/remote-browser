[package]
name = "remote-browser-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Standalone stdio MCP client and local-network connector for Remote Browser"

[[bin]]
name = "remote-browser"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
futures-util = { version = "0.3", features = ["sink"] }
remote-browser-network = { path = "../network" }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "signal", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7", features = ["codec"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = "thin"

[lints.rust]
unsafe_code = "forbid"
