[package]
name = "remote-browser-cef-engine"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[dependencies]
remote-browser-native = { path = "../host" }
cef = "154.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.23.1"
fs2 = "0.4"

[profile.dev]
debug = 0
