[package]
name = "remote-browser-network"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Bounded client network tunnels for Remote Browser"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["io-util", "net", "sync", "time", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

[lints.rust]
unsafe_code = "forbid"
