[package]
name = "remote-browser-servo"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Experimental Servo automation API and local MCP server"

[dependencies]
axum = "0.8.8"
fs2 = "0.4"
libc = "0.2"
sha2 = "0.10"
getrandom = "0.4"
scrypt = { version = "0.11", default-features = false }
subtle = "2.6"
unicode-normalization = "0.1"
unicode_categories = "0.1"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "process", "io-util", "net"] }
uuid = { version = "1.26.1", features = ["v4"] }

[profile.release]
strip = true

[lints.rust]
unsafe_code = "forbid"
