[package]
name = "servo-private-state-tokens"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[features]
boringssl = ["dep:servo-pst-crypto"]

[dependencies]
servo-pst-crypto = { path = "../pst-crypto", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
http = "1"
url = "2"

[lints.rust]
unsafe_code = "forbid"
