name: Local MCP client

on:
  push:
    branches: [main]
    paths:
      - "src/local-mcp/**"
      - "src/network/**"
      - "scripts/release-local-mcp*"
      - "scripts/install-mcp.*"
      - ".github/workflows/local-mcp-release.yml"
  pull_request:
    paths:
      - "src/local-mcp/**"
      - "src/network/**"
      - "scripts/release-local-mcp*"
      - "scripts/install-mcp.*"
      - ".github/workflows/local-mcp-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-mcp-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            name: linux-x64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            name: linux-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-x64
          - runner: macos-15
            target: aarch64-apple-darwin
            name: macos-arm64
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            name: windows-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      REMOTE_BROWSER_BUILD_REVISION: ${{ github.sha }}
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.10"
      - name: Set up the Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
          rustup default 1.88.0
          rustup target add '${{ matrix.target }}'
      - name: Set up static Linux linking
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Check and test the shared network module
        run: |
          cargo fmt --manifest-path src/network/Cargo.toml --check
          cargo test --locked --manifest-path src/network/Cargo.toml
          cargo clippy --locked --manifest-path src/network/Cargo.toml --all-targets -- -D warnings
      - name: Check and test the local MCP
        run: |
          cargo fmt --manifest-path src/local-mcp/Cargo.toml --check
          cargo test --locked --manifest-path src/local-mcp/Cargo.toml
          cargo clippy --locked --manifest-path src/local-mcp/Cargo.toml --all-targets -- -D warnings
      - name: Build the standalone executable
        run: cargo build --locked --release --manifest-path src/local-mcp/Cargo.toml --target ${{ matrix.target }}
      - name: Package the executable
        run: bun scripts/release-local-mcp.ts package ${{ matrix.name }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-mcp-${{ matrix.name }}
          path: dist/local-mcp/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.10"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: local-mcp-*
          path: dist/local-mcp
          merge-multiple: true
      - name: Publish the complete client release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release-local-mcp.ts publish
