name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.10"
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check formatting, types and lint rules
        run: bun run format:check && bun run typecheck && bun run lint
      - name: Build the dashboard
        run: bun run build
      - name: Test Bun tooling
        run: bun run test:unit
      - name: Test the host
        run: bun run test:host
      - name: Test the engine
        run: bun run test:engine --release
      - name: Lint the host
        run: bun run lint:host
      - name: Lint the engine
        run: bun run lint:engine --release

      - name: Test and lint the local MCP and network transport
        run: bun run test:network && bun run test:local-mcp && bun run lint:network && bun run lint:local-mcp
      - name: Build the local MCP integration executables
        run: bun run build:host && bun run build:engine --release && bun run build:local-mcp
      - name: Verify local MCP against the actual CEF engine
        run: >-
          bun run test:integration --suite local-mcp --host-binary src/host/target/debug/remote-browser-native --engine-binary src/engine/target/release/remote-browser-cef-engine --local-mcp-binary src/local-mcp/target/debug/remote-browser
