name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.10"
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check formatting, types and lint rules
        run: bun run format:check && bun run typecheck && bun run lint
      - name: Build the dashboard
        run: bun run build
      - name: Test CEF runtime preparation
        run: python3 scripts/test_prepare_cef.py
      - name: Test the host
        run: cargo test --manifest-path src/host/Cargo.toml
      - name: Lint the host
        run: cargo clippy --manifest-path src/host/Cargo.toml --all-targets -- -D warnings
